plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseAlias = keystoreProperties['keyAlias'] ?: System.getenv('MODU_ANDROID_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('MODU_ANDROID_KEY_PASSWORD')
def releaseStorePassword = keystoreProperties['storePassword'] ?: System.getenv('MODU_ANDROID_KEY_PASSWORD')
def releaseStore = keystoreProperties['storeFile'] ?: System.getenv('MODU_ANDROID_KEYSTORE')
// Direct `flutter build apk` does not load the wrapper's environment. Use the
// same ignored local identity as scripts/build_android.mjs when nothing else is set.
if (!releaseStore) {
    def secretsKey = rootProject.file('../.release-secrets/modu-release.jks')
    def secretsFile = rootProject.file('../.release-secrets/android-signing.json')
    if (secretsKey.exists() && secretsFile.exists()) {
        def saved = new groovy.json.JsonSlurper().parse(secretsFile)
        releaseStore = secretsKey.absolutePath
        releaseAlias = releaseAlias ?: saved.alias
        releaseKeyPassword = releaseKeyPassword ?: saved.password
        releaseStorePassword = releaseStorePassword ?: saved.password
    }
}

android {
    namespace = "com.modu.reader"
    // compileSdk flutter.compileSdkVersion
    compileSdk 36
    ndkVersion = flutter.ndkVersion
    // Exercise the same minified code used by the published APK, not debug.
    testBuildType = "release"

    compileOptions {
        // flutter_local_notifications schedules with java.time on older Android.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        // Native inference fixtures are only in the separate CI test APK.
        androidTest.assets.srcDirs += '../../build/model-test-fixtures'
    }

    defaultConfig {
        applicationId "com.modu.reader"
        minSdkVersion 26
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        targetSdkVersion 35
        testInstrumentationRunner "com.modu.reader.EmbeddingReleaseInstrumentation"
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias releaseAlias
            keyPassword releaseKeyPassword
            storeFile releaseStore ? file(releaseStore) : null
            storePassword releaseStorePassword
        }
    }

    buildTypes {
        release {
            // signingConfig signingConfigs.debug
            signingConfig = signingConfigs.release
            proguardFiles 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // Preserve native-library extraction; AGP 9 requires this in Gradle, not the manifest.
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def abiVersionCode = 0
            if (output.getFilter(com.android.build.OutputFile.ABI) != null) {
                def abiName = output.getFilter(com.android.build.OutputFile.ABI)
                switch(abiName) {
                    case "armeabi-v7a":
                        abiVersionCode = 0 
                        break
                    case "arm64-v8a":
                        abiVersionCode = 0
                        break
                    case "x86":
                        abiVersionCode = 0
                        break
                    case "x86_64":
                        abiVersionCode = 0
                        break
                }
            }
            output.versionCodeOverride = flutterVersionCode.toInteger() + abiVersionCode
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

flutter {
    source = '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
}
